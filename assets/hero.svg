<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" width="1280" height="480" role="img" aria-label="ADHD: messy files fly into tidy folders">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0e22"/><stop offset="1" stop-color="#1c1245"/></linearGradient>
<linearGradient id="g" gradientUnits="userSpaceOnUse" x1="380" y1="0" x2="900" y2="0">
<stop offset="0" stop-color="#ff7a59"/><stop offset=".5" stop-color="#ffd166"/><stop offset="1" stop-color="#5eead4"/>
<animateTransform attributeName="gradientTransform" type="translate" values="-260 0;260 0;-260 0" dur="7s" repeatCount="indefinite"/></linearGradient>
<pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity=".07"/></pattern>
</defs>
<style>
.chip{animation:fly 7s ease-in-out infinite;transform-box:fill-box;transform-origin:center;opacity:0}
@keyframes fly{0%{opacity:0;transform:translate(0,0) rotate(var(--r))}10%,22%{opacity:1;transform:translate(0,0) rotate(var(--r))}
62%{opacity:1;transform:translate(var(--dx),var(--dy)) rotate(0deg) scale(.9)}70%,100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.2)}}
.fold rect{animation:glow 7s ease-in-out infinite}
@keyframes glow{0%,50%{stroke-width:2;fill:#0e2a2e}66%{stroke-width:4;fill:#124047}85%,100%{stroke-width:2;fill:#0e2a2e}}
.fold{animation-duration:7s}
.t{animation:rise 1.2s ease-out both}@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
</style>
<rect width="1280" height="480" fill="url(#bg)"/><rect width="1280" height="480" fill="url(#dots)"/>
<text class="t" x="640" y="150" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="900" font-size="150" letter-spacing="6" fill="url(#g)">ADHD</text>
<text class="t" x="640" y="205" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="500" font-size="28" fill="#dcdcf5" style="animation-delay:.25s">Tame your Desktop in 60 seconds. Undo it in one command.</text>
<rect x="262" y="236" width="153" height="30" rx="15" fill="#ffffff" fill-opacity=".07" stroke="#8b8fb8" stroke-opacity=".5"/><text x="338.5" y="256" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#c7c9e6">never deletes</text><rect x="429" y="236" width="153" height="30" rx="15" fill="#ffffff" fill-opacity=".07" stroke="#8b8fb8" stroke-opacity=".5"/><text x="505.5" y="256" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#c7c9e6">dry-run first</text><rect x="596" y="236" width="181" height="30" rx="15" fill="#ffffff" fill-opacity=".07" stroke="#8b8fb8" stroke-opacity=".5"/><text x="686.5" y="256" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#c7c9e6">one-command undo</text><rect x="791" y="236" width="190" height="30" rx="15" fill="#ffffff" fill-opacity=".07" stroke="#8b8fb8" stroke-opacity=".5"/><text x="886.0" y="256" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#c7c9e6">zero dependencies</text>
<text x="50" y="288" font-family="Consolas,'SF Mono',Menlo,monospace" font-size="13" fill="#8b8fb8">before: chaos</text>
<text x="960" y="288" font-family="Consolas,'SF Mono',Menlo,monospace" font-size="13" fill="#8b8fb8">after: a system</text>
<path d="M600 370 h120" stroke="#8b8fb8" stroke-opacity=".35" stroke-dasharray="4 6"/>
<g class="fold" style="animation-delay:0.0s"><rect x="960" y="300" width="260" height="44" rx="10" fill="#0e2a2e" stroke="#5eead4" stroke-width="2"/><path d="M960 310 v-10 a10 10 0 0 1 10 -10 h60 l10 10" fill="none" stroke="#5eead4" stroke-width="2"/><text x="984" y="328" font-family="Consolas,'SF Mono',Menlo,monospace" font-size="17" fill="#5eead4">20_Areas/</text></g><g class="fold" style="animation-delay:0.2s"><rect x="960" y="358" width="260" height="44" rx="10" fill="#0e2a2e" stroke="#5eead4" stroke-width="2"/><path d="M960 368 v-10 a10 10 0 0 1 10 -10 h60 l10 10" fill="none" stroke="#5eead4" stroke-width="2"/><text x="984" y="386" font-family="Consolas,'SF Mono',Menlo,monospace" font-size="17" fill="#5eead4">40_Media/</text></g><g class="fold" style="animation-delay:0.4s"><rect x="960" y="416" width="260" height="44" rx="10" fill="#0e2a2e" stroke="#5eead4" stroke-width="2"/><path d="M960 426 v-10 a10 10 0 0 1 10 -10 h60 l10 10" fill="none" stroke="#5eead4" stroke-width="2"/><text x="984" y="444" font-family="Consolas,'SF Mono',Menlo,monospace" font-size="17" fill="#5eead4">99_Review/</text></g>
<g class="chip" style="--r:-7deg;--dx:925px;--dy:7px;animation-delay:0.00s"><rect x="50" y="300" width="215" height="30" rx="8" fill="#2a1f3d" stroke="#ff8a6b" stroke-width="1.5"/><text x="63" y="320" font-family="Consolas,'SF Mono',Menlo,monospace" font-size="14" fill="#ffb4a0">final_FINAL_v2 (3).pdf</text></g><g class="chip" style="--r:5deg;--dx:925px;--dy:20px;animation-delay:0.35s"><rect x="50" y="345" width="189" height="30" rx="8" fill="#2a1f3d" stroke="#ff8a6b" stroke-width="1.5"/><text x="63" y="365" font-family="Consolas,'SF Mono',Menlo,monospace" font-size="14" fill="#ffb4a0">Screenshot (47).png</text></g><g class="chip" style="--r:-4deg;--dx:925px;--dy:33px;animation-delay:0.70s"><rect x="50" y="390" width="155" height="30" rx="8" fill="#2a1f3d" stroke="#ff8a6b" stroke-width="1.5"/><text x="63" y="410" font-family="Consolas,'SF Mono',Menlo,monospace" font-size="14" fill="#ffb4a0">Copy of cv.docx</text></g><g class="chip" style="--r:8deg;--dx:925px;--dy:-128px;animation-delay:1.05s"><rect x="50" y="435" width="146" height="30" rx="8" fill="#2a1f3d" stroke="#ff8a6b" stroke-width="1.5"/><text x="63" y="455" font-family="Consolas,'SF Mono',Menlo,monospace" font-size="14" fill="#ffb4a0">New folder (2)</text></g><g class="chip" style="--r:6deg;--dx:635px;--dy:43px;animation-delay:1.40s"><rect x="340" y="322" width="155" height="30" rx="8" fill="#2a1f3d" stroke="#ff8a6b" stroke-width="1.5"/><text x="353" y="342" font-family="Consolas,'SF Mono',Menlo,monospace" font-size="14" fill="#ffb4a0">invoice (1).pdf</text></g><g class="chip" style="--r:-9deg;--dx:635px;--dy:55px;animation-delay:1.75s"><rect x="340" y="368" width="103" height="30" rx="8" fill="#2a1f3d" stroke="#ff8a6b" stroke-width="1.5"/><text x="353" y="388" font-family="Consolas,'SF Mono',Menlo,monospace" font-size="14" fill="#ffb4a0">setup.exe</text></g><g class="chip" style="--r:4deg;--dx:635px;--dy:-107px;animation-delay:2.10s"><rect x="340" y="414" width="206" height="30" rx="8" fill="#2a1f3d" stroke="#ff8a6b" stroke-width="1.5"/><text x="353" y="434" font-family="Consolas,'SF Mono',Menlo,monospace" font-size="14" fill="#ffb4a0">untitled-3 - Copy.zip</text></g>
</svg>