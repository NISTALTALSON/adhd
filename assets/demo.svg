<text x="480" y="27" text-anchor="middle" style="opacity:1;fill:#8b8fb8;font-size:13px">adhd — scan, plan, apply, undo</text>
<text class="cmd" x="28" y="84" style="animation:k0 17.0s linear infinite">$ python scripts/organize.py scan Desktop</text><text class="out" x="28" y="111" style="animation:k1 17.0s linear infinite">Loose in root: 10   Duplicates: 1 (11 B wasted)   Junk: 2   Messy names: 4</text><text class="warn" x="28" y="138" style="animation:k2 17.0s linear infinite">Chaos Score: 45/100 [####------]</text><text class="out" x="28" y="165" style="animation:k3 17.0s linear infinite">Verdict: Maze-style chaos: a maze of folders and fiddly file names</text><text class="cmd" x="28" y="192" style="animation:k4 17.0s linear infinite">$ python scripts/organize.py plan Desktop --mode perfect</text><text class="out" x="28" y="219" style="animation:k5 17.0s linear infinite">10 files would move into 9 folders (nothing moved yet):</text><text class="dim" x="28" y="246" style="animation:k6 17.0s linear infinite">  20_Areas/Career            resume-final-final-v2.docx</text><text class="dim" x="28" y="273" style="animation:k7 17.0s linear infinite">  20_Areas/Finance           invoice-airtel.pdf</text><text class="dim" x="28" y="300" style="animation:k8 17.0s linear infinite">  40_Media/Screenshots       2026-11-06_130011_screenshot.png</text><text class="dim" x="28" y="327" style="animation:k9 17.0s linear infinite">  99_Review/Duplicates       photo copy.JPG</text><text class="cmd" x="28" y="354" style="animation:k10 17.0s linear infinite">$ python scripts/organize.py apply plan.json</text><text class="out" x="28" y="381" style="animation:k11 17.0s linear infinite">Moved 10 files, skipped 0.</text><text class="good" x="28" y="408" style="animation:k12 17.0s linear infinite">Chaos Score: 45 -&gt; 1/100 [----------]</text><text class="cmd" x="28" y="435" style="animation:k13 17.0s linear infinite">$ python scripts/organize.py undo Desktop      # changed your mind?</text><text class="good" x="28" y="462" style="animation:k14 17.0s linear infinite">Restored 10 files.</text>
<rect class="cur" x="28" y="479" width="9" height="18"/>
